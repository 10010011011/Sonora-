name: Apply Claude Sonora 1.2.0 and build

on:
  push:
    branches: [sonora-v2]
    paths:
      - '.sonora-upload-parts/**'

permissions:
  contents: write

jobs:
  apply-and-build:
    if: github.event_name == 'push' && contains(toJson(github.event.head_commit.added), '.sonora-upload-parts/part-01.b64')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Apply Claude 1.2.0 archive
        shell: bash
        run: |
          set -euo pipefail
          cat .sonora-upload-parts/part-*.b64 | base64 --decode > "$RUNNER_TEMP/Sonora-1.2.0-patch.tar.xz"
          mkdir -p "$RUNNER_TEMP/claude"
          tar -xJf "$RUNNER_TEMP/Sonora-1.2.0-patch.tar.xz" -C "$RUNNER_TEMP/claude"
          cp -a "$RUNNER_TEMP/claude/." .
          python3 - <<'PY'
          from pathlib import Path
          package = Path("package.json")
          import json
          manifest = json.loads(package.read_text())
          assert manifest["version"] == "1.2.0"
          assert "playlist-and-sheets.test.ts" in manifest["scripts"]["test:core"]
          workflow = Path(".github/workflows/android.yml")
          text = workflow.read_text()
          old = "run: npx tsx --test lyrics-and-dsp.test.ts section2.test.ts"
          assert text.count(old) == 1, "Could not uniquely locate the existing core regression-test command"
          workflow.write_text(text.replace(old, "run: npm run test:core"))
          PY
          rm -rf .sonora-upload-parts
          rm -f .gitkeep "sonora-github-flat-v3 (1).zip"
          rm -f .github/workflows/apply-claude-1.2.0.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Sonora 1.2.0 fixes from Claude archive"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: TypeScript type check
        run: npm run lint

      - name: Lyrics parser regression tests
        run: npm run test:lyrics

      - name: Core regression tests
        run: npm run test:core

      - name: Native helper tests
        run: npm run test:native

      - name: Create Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Install Sonora native layer
        run: bash install-android-native.sh

      - name: Sync web assets
        run: npx cap sync android

      - name: Install Sonora launcher icon
        run: bash set-android-icon.sh

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/Sonora-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sonora-1.2.0-debug-apk
          path: out/*.apk
          if-no-files-found: error
