name: Build Sonora Android APK

on:
  push:
    branches: [main, master, sonora-v2]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sonora-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Sonora project files
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          test -f index.html
          test -f capacitor.config.json
          test -f main.tsx
          echo "Sonora source files found in repository root."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: TypeScript check
        run: npm run lint

      - name: Lyrics parser tests
        run: npm run test:lyrics

      - name: Core regression tests
        run: npm run test:core

      - name: Native helper tests
        run: npm run test:native

      - name: Generate Android project
        run: npx cap add android

      - name: Install Sonora native Android layer
        run: bash install-android-native.sh

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Install Sonora launcher icon
        run: bash set-android-icon.sh

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/Sonora-v${VERSION}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonora-debug-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
