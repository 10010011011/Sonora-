name: Build Android APK

on:
  push:
    branches: [main, master, sonora-v2]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
      - name: TypeScript type check
        run: npm run lint
      - name: Lyrics parser regression tests
        run: npm run test:lyrics
      - name: Core regression tests
        run: npm run test:core
      - name: Native helper tests
        run: npm run test:native
      - name: Create Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
      - name: Install Sonora native layer
        run: bash install-android-native.sh
      - name: Sync web assets
        run: npx cap sync android
      - name: Install Sonora launcher icon
        run: bash set-android-icon.sh
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Prepare APK artifact
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/Sonora-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sonora-debug-apk
          path: out/*.apk
          if-no-files-found: error
      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
